<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Voyantra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D1526; --ink-2: #131F38; --ink-3: #1B2A45;
    --paper: #F6F2E9; --gold: #E7A94C; --gold-soft: rgba(231,169,76,0.14);
    --coral: #E2704F; --teal: #4FC3B0;
    --line: rgba(246,242,233,0.14); --line-strong: rgba(246,242,233,0.28); --muted: rgba(246,242,233,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 15% 15%, rgba(231,169,76,0.12), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(79,195,176,0.10), transparent 40%),
      var(--ink);
    color: var(--paper); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 6vh 6vw;
  }
  a { color: inherit; }
  ::selection { background: var(--gold); color: var(--ink); }

  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; margin-bottom: 22px; justify-content: center; }
  .brand-mark { width: 26px; height: 26px; flex-shrink: 0; }
  .brand-word { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; }
  .brand-word .accent { color: var(--gold); font-weight: 500; font-style: italic; }

  /* ---- Form panel ---- */
  .form-card {
    width: 100%; max-width: 340px;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 20px;
    padding: 32px 30px; box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .back-link {
    display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted);
    margin-bottom: 16px; width: fit-content;
  }
  .back-link:hover { color: var(--gold); }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.6rem; margin-bottom: 6px; text-align: center; }
  .sub { color: var(--muted); font-size: 0.86rem; margin-bottom: 24px; text-align: center; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 7px; }
  .field { margin-bottom: 16px; }
  .input-shell { position: relative; }
  input {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--ink-3); color: var(--paper); font-family: inherit; font-size: 0.9rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input.has-toggle { padding-right: 44px; }
  input::placeholder { color: rgba(246,242,233,0.35); }
  input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(231,169,76,0.15); }
  .toggle-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
    display: flex; align-items: center;
  }
  .toggle-eye:hover { color: var(--paper); }
  .toggle-eye svg { width: 18px; height: 18px; }
  .field-err { font-size: 0.78rem; color: var(--coral); margin-top: 6px; display: none; align-items: center; gap: 5px; }
  .field.invalid input { border-color: var(--coral); }
  .field.invalid .field-err { display: flex; }
  .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.82rem; }
  .row-between a { color: var(--gold); }
  .checkline { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .checkline input { width: auto; accent-color: var(--gold); }
  button.submit {
    width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--gold); color: var(--ink); font-weight: 700; font-size: 0.92rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.submit:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(231,169,76,0.3); }
  button.submit:disabled { opacity: 0.7; cursor: default; transform: none; box-shadow: none; }
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(13,21,38,0.3); border-top-color: var(--ink);
    animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .switch { text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
  .switch a { color: var(--gold); font-weight: 600; }
  .success-banner {
    display: none; align-items: center; gap: 10px; background: rgba(79,195,176,0.12);
    border: 1px solid var(--teal); color: var(--teal); padding: 12px 14px; border-radius: 10px;
    font-size: 0.85rem; margin-bottom: 22px;
  }
  .success-banner.show { display: flex; }
  .error-banner {
    display: none; align-items: center; gap: 10px; background: rgba(226,112,79,0.12);
    border: 1px solid var(--coral); color: var(--coral); padding: 12px 14px; border-radius: 10px;
    font-size: 0.85rem; margin-bottom: 22px;
  }
  .error-banner.show { display: flex; }
</style>
</head>
<body>

<div class="form-card">
  <a href="index.jsp" class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18.5" stroke="#E7A94C" stroke-width="1.4" opacity="0.4"/>
      <path d="M20 5 L24.5 17.5 L20 20 L15.5 17.5 Z" fill="#E7A94C"/>
      <path d="M20 35 L15.5 22.5 L20 20 L24.5 22.5 Z" fill="#F6F2E9" opacity="0.85"/>
      <circle cx="20" cy="20" r="3" fill="#0D1526" stroke="#E7A94C" stroke-width="1.4"/>
    </svg>
    <span class="brand-word">Voy<span class="accent">antra</span></span>
  </a>
  <a href="index.jsp" class="back-link">← Back to home</a>
  <h1 data-i18n="auth_login_title">Welcome back</h1>
    <p class="sub" data-i18n="auth_login_sub">Log in to see your saved trips and itineraries.</p>

    <div class="success-banner" id="successBanner">✓ Logged in — redirecting...</div>
    <div class="error-banner" id="errorBanner"></div>

    <form id="loginForm" action="LoginServlet" method="POST" novalidate>
      <div class="field" id="emailField">
        <label for="email" data-i18n="auth_email_label">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <div class="field-err">⚠ Enter a valid email address</div>
      </div>
      <div class="field" id="passField">
        <label for="password" data-i18n="auth_password_label">Password</label>
        <div class="input-shell">
          <input type="password" id="password" name="password" class="has-toggle" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-err">⚠ Password is required</div>
      </div>
      <div class="row-between">
        <label class="checkline"><input type="checkbox"> <span data-i18n="auth_remember">Remember me</span></label>
        <a href="#" data-i18n="auth_forgot">Forgot password?</a>
      </div>
      <button type="submit" class="submit"><span class="spinner" id="loginSpinner"></span><span id="loginBtnText" data-i18n="auth_login_btn">Log in</span></button>
    </form>

  <div class="switch"><span data-i18n="auth_login_switch">Don't have an account?</span> <a href="register.html" data-i18n="auth_login_switch_link">Register here</a></div>
  <div class="switch" style="margin-top:8px;"><a href="vendor-login.html">Vendor login</a> &middot; <a href="admin-login.html">Admin login</a></div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const emailField = document.getElementById('emailField');
  const passField = document.getElementById('passField');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const banner = document.getElementById('successBanner');
  const toggleEye = document.getElementById('toggleEye');
  const eyeIcon = document.getElementById('eyeIcon');

  toggleEye.addEventListener('click', () => {
    const showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    eyeIcon.innerHTML = showing
      ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.4 10.4 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.44 3.34M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>';
  });

  function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  email.addEventListener('input', () => { if (emailField.classList.contains('invalid') && validEmail(email.value)) emailField.classList.remove('invalid'); });
  password.addEventListener('input', () => { if (passField.classList.contains('invalid') && password.value) passField.classList.remove('invalid'); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    if (!validEmail(email.value)) { emailField.classList.add('invalid'); ok = false; } else { emailField.classList.remove('invalid'); }
    if (!password.value) { passField.classList.add('invalid'); ok = false; } else { passField.classList.remove('invalid'); }
    if (!ok) return;

    const btn = form.querySelector('.submit');
    const spinner = document.getElementById('loginSpinner');
    const btnText = document.getElementById('loginBtnText');
    const errorBanner = document.getElementById('errorBanner');
    errorBanner.classList.remove('show');
    btn.disabled = true; spinner.style.display = 'inline-block'; btnText.textContent = 'Logging in...';

    fetch('LoginServlet', { method: 'POST', body: new URLSearchParams(new FormData(form)) })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          banner.classList.add('show');
          setTimeout(() => { window.location.href = data.redirect; }, 700);
        } else {
          errorBanner.textContent = '⚠ ' + data.message;
          errorBanner.classList.add('show');
          btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Log in';
        }
      })
      .catch(() => {
        errorBanner.textContent = '⚠ Could not reach the server. Please try again.';
        errorBanner.classList.add('show');
        btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Log in';
      });
  });
</script>
<script src="js/i18n.js?v=5"></script>
<script src="js/chatbot.js?v=3"></script>
</body>
</html>
